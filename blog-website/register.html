<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Candal|Lora&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Registration</title>
</head>
<body>
    <header>
        <div class="logo">
            <h1 class="logo-text"><span>Latest</span>News</h1>
        </div>
        <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
            <i class="fa fa-bars" aria-hidden="true"></i>
        </button>
        <ul class="nav">
            <li><a href="blog.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="register.html">Sign up</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </header>
    <div class="auth-content">
        <form action="#" method="post">
            <h2 class="form-title">Register</h2>
            <div>
                <label for="username">Username</label>
                <input id="username" type="text" name="username" class="text-input">
            </div>
            <div>
                <label for="email">Email</label>
                <input id="email" type="email" name="email" class="text-input">
            </div>
            <div>
                <label for="password">Password</label>
                <input id="password" type="password" name="password" class="text-input">
            </div>
            <div>
                <label for="confirm-password">Confirm password</label>
                <input id="confirm-password" type="password" name="password_confirmation" class="text-input">
            </div>
            <div>
                <button type="submit" name="register-btn" class="btn btn-big">Register</button>
                <p>Or <a href="login.html">Sign in</a></p>
            </div>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
