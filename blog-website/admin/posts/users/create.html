<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Candal|Lora&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../../../css/admin.css">
    <title>Admin Section - Add User</title>
</head>
<body>
    <header>
        <div class="logo">
            <h1 class="logo-text"><span>Latest</span>News</h1>
        </div>
        <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
            <i class="fa fa-bars" aria-hidden="true"></i>
        </button>
        <ul class="nav">
            <li>
                <a href="#">
                    <i class="fa fa-user"></i> Account
                    <i class="fa fa-chevron-down" style="font-size: .8em;"></i>
                </a>
                <ul>
                    <li><a href="../../../blog.html">View site</a></li>
                    <li><a href="#" class="logout">Logout</a></li>
                </ul>
            </li>
        </ul>
    </header>
    <div class="admin-wrapper">
        <div class="left-sidebar">
            <ul>
                <li><a href="../posts/index.html">Manage Posts</a></li>
                <li><a href="index.html">Manage Users</a></li>
                <li><a href="../topics/index.html">Manage Topics</a></li>
            </ul>
        </div>
        <div class="admin-content">
            <div class="button-group">
                <a href="create.html" class="btn btn-big">Add User</a>
                <a href="index.html" class="btn btn-big">Manage Users</a>
            </div>
            <div class="content">
                <h2 class="page-title">Add User</h2>
                <form action="#" method="post">
                    <div>
                        <label for="username">Username</label>
                        <input id="username" type="text" name="username" class="text-input">
                    </div>
                    <div>
                        <label for="email">Email</label>
                        <input id="email" type="email" name="email" class="text-input">
                    </div>
                    <div>
                        <label for="password">Password</label>
                        <input id="password" type="password" name="password" class="text-input">
                    </div>
                    <div>
                        <label for="confirm-password">Confirm password</label>
                        <input id="confirm-password" type="password" name="password_confirmation" class="text-input">
                    </div>
                    <div>
                        <label for="role">Role</label>
                        <select id="role" name="role" class="text-input">
                            <option value="Author">Author</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                    <div>
                        <button type="submit" class="btn btn-big">Add User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../../../scripts.js"></script>
</body>
</html>
